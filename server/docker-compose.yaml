services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres          
      POSTGRES_PASSWORD: postgres-root-password
      POSTGRES_DB: postgres            
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: